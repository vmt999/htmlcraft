<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Clone V5.4 - Dynamic Structures</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; user-select: none; font-family: 'Courier New', monospace; }
        
        /* --- GIAO DIỆN MENU CHÍNH --- */
        #ui-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 200;
        }

        .game-title {
            font-size: 80px; font-weight: bold; color: #fff;
            text-shadow: 6px 6px 0 #333; margin-bottom: 50px; text-align: center;
        }

        .menu-screen { display: none; flex-direction: column; align-items: center; }

        /* Nút bấm kiểu Minecraft */
        .mc-btn {
            background-color: #7d7d7d; color: white; font-family: 'Courier New', monospace;
            font-size: 20px; font-weight: bold; padding: 12px 20px; width: 350px; margin: 8px;
            border: 3px solid; border-top-color: #fff; border-left-color: #fff;
            border-bottom-color: #373737; border-right-color: #373737; cursor: pointer; text-align: center;
        }
        .mc-btn:hover { background-color: #8b8b8b; }
        .mc-btn:active {
            border-top-color: #373737; border-left-color: #373737;
            border-bottom-color: #fff; border-right-color: #fff;
        }
        .mc-btn.small { width: auto; font-size: 16px; padding: 6px 15px; }

        /* Khung TẠO THẾ GIỚI */
        #create-world-menu {
            background-color: #c6c6c6; padding: 20px 30px; border: 4px solid #555;
            border-top-color: #fff; border-left-color: #fff; color: #000; width: 450px;
        }
        #create-world-menu h2 { text-align: center; margin-top: 0; }
        .setting-group { margin-bottom: 15px; font-weight: bold; }
        .setting-group input[type="number"] { width: 60px; font-family: inherit; font-size: 16px; }
        
        #layers-container { background: #8b8b8b; padding: 10px; border: 2px solid #373737; margin-bottom: 10px; max-height: 200px; overflow-y: auto;}
        .layer-row { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; }
        .layer-row select, .layer-row input { font-family: inherit; font-size: 14px; padding: 3px; }
        .btn-remove-layer { background: #ff5555; color: white; border: 2px solid #aa0000; cursor: pointer; font-weight: bold;}

        /* --- STYLES GAMEPLAY (Crosshair, túi đồ, hotbar) --- */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 28px; pointer-events: none; display: none; z-index: 50;
        }
        #hotbar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: none; flex-direction: row; gap: 2px; z-index: 60;
            background: rgba(139, 139, 139, 0.5); padding: 4px; border: 2px solid #373737;
        }
        #inventory-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; background: #c6c6c6; padding: 15px; border: 4px solid #555;
            border-top-color: #fff; border-left-color: #fff; z-index: 70;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }
        .inv-grid { display: grid; grid-template-columns: repeat(9, 50px); gap: 4px; margin-bottom: 20px; }
        .slot {
            width: 50px; height: 50px; background-color: #8b8b8b;
            border: 2px solid #373737; border-top-color: #fff; border-left-color: #fff;
            display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
        }
        .slot:hover { background-color: #a0a0a0; }
        .slot.selected { border: 2px solid #ffff00; background-color: #a0a0a0; }
        .icon { width: 32px; height: 32px; box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3), inset 4px 4px 0px rgba(255,255,255,0.3); pointer-events: none; }
        
        .icon-stone { background: #7d7d7d; }
        .icon-grass { background: linear-gradient(to bottom, #55aa55 30%, #8b4513 30%); }
        .icon-dirt { background: #8b4513; }
        .icon-wood { background: #6b4226; }
        .icon-leaves { background: #2d631a; }
        .icon-sand { background: #dcb57a; }
        .icon-brick { background: #8f3b2f; }
        .icon-glass { background: #88ccff; opacity: 0.7; }
        .icon-cobble { background: #555555; }

        #floating-item { position: absolute; pointer-events: none; z-index: 9999; display: none; width: 32px; height: 32px; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <!-- MENU UI TỔNG -->
    <div id="ui-container">
        <!-- 1. Màn hình chính -->
        <div id="main-menu" class="menu-screen" style="display: flex;">
            <div class="game-title">HTMLCRAFT</div>
            <button id="btn-singleplayer" class="mc-btn">Chơi đơn</button>
        </div>

        <!-- 2. Màn hình tạm dừng -->
        <div id="pause-menu" class="menu-screen">
            <div class="game-title" style="font-size: 50px; margin-bottom: 30px;">TẠM DỪNG TRÒ CHƠI</div>
            <button id="btn-resume" class="mc-btn">Tiếp tục chơi</button>
            <button id="btn-new-world" class="mc-btn">Tạo thế giới mới</button>
        </div>

        <!-- 3. Màn hình tạo thế giới -->
        <div id="create-world-menu" class="menu-screen">
            <h1>TẠO THẾ GIỚI</h1>
            <h10>game made by vmt - vesion: alpha-5.5</h2>
            
            <div class="setting-group">
                <label>Độ rộng thế giới (4 block = 1 chunk): 
                    <input type="number" id="world-size" value="12" min="5" max="50">
                </label>
            </div>

            <div class="setting-group">Thứ tự các lớp (cao bên dưới, thấp bên trên):</div>
            <div id="layers-container">
                <!-- Chứa các lớp được thêm bằng JS -->
            </div>
            <button id="btn-add-layer" class="mc-btn small" style="margin-bottom: 15px;">+ Thêm lớp mới</button>

            <div class="setting-group">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="toggle-structures" checked> Sinh con 8=D random
                </label>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <button id="btn-cancel-create" class="mc-btn small" style="width: 48%; background: #ff5555;">Hủy</button>
                <button id="btn-create-world" class="mc-btn small" style="width: 48%; background: #55aa55;">Create World</button>
            </div>
        </div>
    </div>

    <!-- UI GAMEPLAY -->
    <div id="crosshair">+</div>
    <div id="inventory-screen">
        <h3 style="margin: 0 0 10px 0; font-family: sans-serif; color: #333;">Kho đồ</h3>
        <div class="inv-grid" id="inventory-grid"></div>
    </div>
    <div id="hotbar"></div>
    <div id="floating-item"></div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/PointerLockControls.js';

        // --- DANH SÁCH BLOCK ---
        const blockTypes = ['stone', 'grass', 'dirt', 'wood', 'leaves', 'sand', 'brick', 'glass', 'cobble'];
        const blockNames = { stone: 'Đá', grass: 'Cỏ', dirt: 'Đất', wood: 'Gỗ', leaves: 'Lá', sand: 'Cát', brick: 'Gạch', glass: 'Kính', cobble: 'Đá Cuội' };

        // --- HỆ THỐNG MENU & LOGIC TẠO THẾ GIỚI ---
        let hasGeneratedWorld = false;

        function showMenu(menuId) {
            document.querySelectorAll('.menu-screen').forEach(el => el.style.display = 'none');
            if (menuId) {
                document.getElementById('ui-container').style.display = 'flex';
                document.getElementById(menuId).style.display = 'flex';
            } else {
                document.getElementById('ui-container').style.display = 'none';
            }
        }

        // Khởi tạo các lớp mặc định ban đầu
        function addLayerRow(type, thickness) {
            const row = document.createElement('div');
            row.className = 'layer-row';
            let optionsHTML = blockTypes.map(b => `<option value="${b}" ${b===type?'selected':''}>${blockNames[b]}</option>`).join('');
            row.innerHTML = `
                <select class="layer-type">${optionsHTML}</select>
                <span>Độ dày:</span>
                <input type="number" class="layer-thickness" value="${thickness}" min="1" max="10">
                <button class="btn-remove-layer" title="Xóa lớp">X</button>
            `;
            row.querySelector('.btn-remove-layer').onclick = () => row.remove();
            document.getElementById('layers-container').appendChild(row);
        }

        // Chèn lớp mặc định vào UI
        addLayerRow('stone', 1);
        addLayerRow('dirt', 2);
        addLayerRow('sand', 1);
        addLayerRow('grass', 1);

        document.getElementById('btn-add-layer').onclick = () => addLayerRow('stone', 1);

        document.getElementById('btn-singleplayer').onclick = () => showMenu('create-world-menu');
        document.getElementById('btn-new-world').onclick = () => showMenu('create-world-menu');
        
        document.getElementById('btn-cancel-create').onclick = () => {
            if (hasGeneratedWorld) showMenu('pause-menu');
            else showMenu('main-menu');
        };
        
        document.getElementById('btn-resume').onclick = () => {
            controls.lock(); // Khoá chuột để chơi tiếp
        };

        // --- TẠO THẾ GIỚI ---
        document.getElementById('btn-create-world').onclick = () => {
            // Xóa thế giới cũ
            blocks.forEach(b => scene.remove(b));
            blocks.length = 0;
            for (let prop in worldData) delete worldData[prop];

            // Lấy thông số từ UI
            const size = parseInt(document.getElementById('world-size').value) || 12;
            const useStructures = document.getElementById('toggle-structures').checked;
            const layers = [];
            document.querySelectorAll('.layer-row').forEach(row => {
                layers.push({
                    type: row.querySelector('.layer-type').value,
                    thickness: parseInt(row.querySelector('.layer-thickness').value)
                });
            });

            // Xây dựng địa hình theo lớp
            for (let x = -size; x < size; x++) {
                for (let z = -size; z < size; z++) {
                    let cy = 1;
                    layers.forEach(layer => {
                        for(let t = 0; t < layer.thickness; t++){
                            createBlock(x, cy, z, layer.type);
                            cy++;
                        }
                    });
                }
            }

            // Sinh công trình ngẫu nhiên có kiểm tra toạ độ Y cao nhất
            if (useStructures) {
                for (let i = 0; i < 8; i++) {
                    const rx = Math.floor(Math.random() * (size * 2)) - size; 
                    const rz = Math.floor(Math.random() * (size * 2)) - size; 
                    
                    // Dùng hàm getHighestBlockYAt để tìm xem mặt đất tại rx, rz đang ở toạ độ Y nào
                    let highestY = getHighestBlockYAt(rx, rz);
                    
                    // Nếu tìm thấy đất, lấy toạ độ Y đó + 1 làm chân công trình
                    if (highestY !== null) {
                        let buildY = highestY + 1;
                        createBlock(rx, buildY, rz, 'stone');            // Chân 1
                        createBlock(rx, buildY, rz + 2, 'stone');        // Chân 2 đặt chung Y với Chân 1
                        createBlock(rx, buildY + 1, rz + 1, 'stone');    // Thân giữa
                        createBlock(rx, buildY + 2, rz + 1, 'stone');    // Đỉnh
                    }
                }
            }

            updateBlocksVisibility();
            hasGeneratedWorld = true;
            spawnPlayer();
            controls.lock(); // Vào game luôn
        };

        // --- KHO ĐỒ ---
        let hotbarData = ['stone', 'grass', 'dirt', 'wood', 'leaves', 'sand', 'brick', 'glass', 'cobble'];
        let inventoryData = new Array(27).fill(null);
        let inventorySelectedSlot = 0; 
        let cursorItem = null;         
        let isInventoryOpen = false;

        const hotbarUI = document.getElementById('hotbar');
        const inventoryUI = document.getElementById('inventory-grid');
        const floatingItemUI = document.getElementById('floating-item');

        function createSlotHTML(type, index, isHotbar) {
            const slotDiv = document.createElement('div');
            slotDiv.className = 'slot' + (isHotbar && index === inventorySelectedSlot ? ' selected' : '');
            if (type) {
                const icon = document.createElement('div');
                icon.className = `icon icon-${type}`;
                slotDiv.appendChild(icon);
            }
            slotDiv.addEventListener('mousedown', (e) => handleSlotClick(e, index, isHotbar));
            return slotDiv;
        }

        function renderInventoryUI() {
            hotbarUI.innerHTML = ''; inventoryUI.innerHTML = '';
            hotbarData.forEach((item, index) => hotbarUI.appendChild(createSlotHTML(item, index, true)));
            inventoryData.forEach((item, index) => inventoryUI.appendChild(createSlotHTML(item, index, false)));

            if (cursorItem) {
                floatingItemUI.style.display = 'block';
                floatingItemUI.className = `icon icon-${cursorItem}`;
            } else {
                floatingItemUI.style.display = 'none';
            }
        }

        function handleSlotClick(e, index, isHotbar) {
            if (e.button !== 0) return; 
            let dataArray = isHotbar ? hotbarData : inventoryData;
            let clickedItem = dataArray[index];

            if (!cursorItem && clickedItem) {
                cursorItem = clickedItem; dataArray[index] = null;
            } else if (cursorItem && !clickedItem) {
                dataArray[index] = cursorItem; cursorItem = null;
            } else if (cursorItem && clickedItem) {
                let temp = clickedItem; dataArray[index] = cursorItem; cursorItem = temp;
            }
            renderInventoryUI();
        }

        document.addEventListener('mousemove', (e) => {
            if (cursorItem && isInventoryOpen) {
                floatingItemUI.style.left = e.clientX + 'px'; floatingItemUI.style.top = e.clientY + 'px';
            }
        });

        function updateSelectedSlot(index) {
            inventorySelectedSlot = index; renderInventoryUI();
        }
        renderInventoryUI();

        // --- KHỞI TẠO THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 35);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xcccccc));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); dirLight.position.set(10, 20, 10); scene.add(dirLight);

        // --- TEXTURE ---
        function generatePixelTexture(baseColor, noiseColor, type = 'normal') {
            const canvas = document.createElement('canvas'); canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 16, 16);
            for (let i = 0; i < 16; i++) {
                for (let j = 0; j < 16; j++) {
                    if (Math.random() > 0.6) { ctx.fillStyle = noiseColor; ctx.fillRect(i, j, 1, 1); }
                }
            }
            if (type === 'grass_side') {
                ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 16, 16); 
                ctx.fillStyle = '#55aa55'; ctx.fillRect(0, 0, 16, 4);  
                for (let i = 0; i < 16; i++) {
                    for (let j = 0; j < 5; j++) { if (Math.random() > 0.5) { ctx.fillStyle = '#448844'; ctx.fillRect(i, j, 1, 1); } }
                }
            }
            const tex = new THREE.CanvasTexture(canvas); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const matStone = new THREE.MeshStandardMaterial({ map: generatePixelTexture('#7d7d7d', '#606060') });
        const matDirt = new THREE.MeshStandardMaterial({ map: generatePixelTexture('#8b4513', '#70350d') });
        const matWood = new THREE.MeshStandardMaterial({ map: generatePixelTexture('#6b4226', '#523018') });
        const matLeaves = new THREE.MeshStandardMaterial({ map: generatePixelTexture('#2d631a', '#1e4710') });
        const matSand = new THREE.MeshStandardMaterial({ map: generatePixelTexture('#dcb57a', '#c29d62') });
        const matBrick = new THREE.MeshStandardMaterial({ map: generatePixelTexture('#8f3b2f', '#732d23') });
        const matGlass = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5 });
        const matCobble = new THREE.MeshStandardMaterial({ map: generatePixelTexture('#555555', '#333333') });
        const texGrassSide = generatePixelTexture('#8b4513', '#70350d', 'grass_side');
        const matsGrass = [ new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: generatePixelTexture('#55aa55', '#448844') }), matDirt, new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: texGrassSide }) ];

        // --- QUẢN LÝ BLOCK ---
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const blocks = []; const worldData = {};

        function setBlockData(x, y, z, mesh) {
            if (!worldData[x]) worldData[x] = {}; if (!worldData[x][y]) worldData[x][y] = {};
            worldData[x][y][z] = mesh;
        }
        function getBlockData(x, y, z) { return worldData[x] && worldData[x][y] ? worldData[x][y][z] : null; }
        function removeBlockData(x, y, z) { if (worldData[x] && worldData[x][y]) delete worldData[x][y][z]; }

        function updateBlocksVisibility() {
            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i].position;
                blocks[i].visible = !(getBlockData(b.x + 1, b.y, b.z) && getBlockData(b.x - 1, b.y, b.z) && getBlockData(b.x, b.y + 1, b.z) && getBlockData(b.x, b.y - 1, b.z) && getBlockData(b.x, b.y, b.z + 1) && getBlockData(b.x, b.y, b.z - 1)); 
            }
        }

        function createBlock(x, y, z, type) {
            let mat = matStone;
            switch(type) { case 'grass': mat = matsGrass; break; case 'dirt': mat = matDirt; break; case 'wood': mat = matWood; break; case 'leaves': mat = matLeaves; break; case 'sand': mat = matSand; break; case 'brick': mat = matBrick; break; case 'glass': mat = matGlass; break; case 'cobble': mat = matCobble; break; }
            const block = new THREE.Mesh(geometry, mat); block.position.set(x, y, z); block.name = type; block.frustumCulled = true; 
            scene.add(block); blocks.push(block); setBlockData(x, y, z, block);
        }

        // --- ĐIỀU KHIỂN & PLAYER ---
        const controls = new PointerLockControls(camera, document.body);
        const player = { height: 1.6, speed: 4.0, jumpForce: 7.0, velocity: new THREE.Vector3(), canJump: false };
        const gravity = 20.0;
        let isFlying = false, isCrouching = false, shiftPressed = false, spacePressed = false, lastSpaceTime = 0;
        const move = { forward: false, backward: false, left: false, right: false };

        function getHighestBlockYAt(x, z) {
            for (let y = 30; y >= -10; y--) { if (getBlockData(x, y, z)) return y; }
            return null; 
        }
        function spawnPlayer() {
            let spawnX = 0, spawnZ = 0, highestY = getHighestBlockYAt(0, 0);
            if (highestY === null) highestY = 5; 
            camera.position.set(spawnX, highestY + 0.5 + player.height, spawnZ);
            player.velocity.y = 0;
        }

        // --- XỬ LÝ KHÓA/MỞ CHUỘT (PAUSE LOGIC) ---
        controls.addEventListener('lock', () => {
            showMenu(null);
            isInventoryOpen = false;
            document.getElementById('inventory-screen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hotbar').style.display = 'flex';
        });
        
        controls.addEventListener('unlock', () => {
            if (isInventoryOpen) {
                document.getElementById('inventory-screen').style.display = 'block';
                document.getElementById('crosshair').style.display = 'none';
                document.getElementById('hotbar').style.display = 'flex';
            } else {
                if (hasGeneratedWorld) showMenu('pause-menu');
                else showMenu('main-menu');
                document.getElementById('crosshair').style.display = 'none';
                document.getElementById('hotbar').style.display = 'none';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' && document.getElementById('create-world-menu').style.display === 'flex') {
                if (hasGeneratedWorld) showMenu('pause-menu');
                else showMenu('main-menu');
                return;
            }

            if (e.code === 'KeyE' && hasGeneratedWorld) {
                if (controls.isLocked) { isInventoryOpen = true; controls.unlock(); } 
                else if (isInventoryOpen) {
                    isInventoryOpen = false; controls.lock();
                    if (cursorItem) { cursorItem = null; floatingItemUI.style.display = 'none'; }
                }
                return;
            }

            if (!controls.isLocked) return; 
            switch (e.code) {
                case 'KeyW': move.forward = true; break;
                case 'KeyA': move.left = true; break;
                case 'KeyS': move.backward = true; break;
                case 'KeyD': move.right = true; break;
                case 'ShiftLeft': case 'ShiftRight': shiftPressed = true; break;
                case 'Space':
                    spacePressed = true;
                    const now = performance.now();
                    if (now - lastSpaceTime < 300) { isFlying = !isFlying; player.velocity.y = 0; } 
                    else if (!isFlying && player.canJump) { player.velocity.y = player.jumpForce; player.canJump = false; }
                    lastSpaceTime = now; break;
                case 'Digit1': updateSelectedSlot(0); break; case 'Digit2': updateSelectedSlot(1); break;
                case 'Digit3': updateSelectedSlot(2); break; case 'Digit4': updateSelectedSlot(3); break;
                case 'Digit5': updateSelectedSlot(4); break; case 'Digit6': updateSelectedSlot(5); break;
                case 'Digit7': updateSelectedSlot(6); break; case 'Digit8': updateSelectedSlot(7); break;
                case 'Digit9': updateSelectedSlot(8); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': move.forward = false; break; case 'KeyA': move.left = false; break;
                case 'KeyS': move.backward = false; break; case 'KeyD': move.right = false; break;
                case 'ShiftLeft': case 'ShiftRight': shiftPressed = false; break; case 'Space': spacePressed = false; break;
            }
        });

        document.addEventListener('wheel', (e) => {
            if (!controls.isLocked) return;
            let newSlot = inventorySelectedSlot + (e.deltaY > 0 ? 1 : -1);
            if(newSlot < 0) newSlot = 8; if(newSlot > 8) newSlot = 0; 
            updateSelectedSlot(newSlot);
        });

        // --- TƯƠNG TÁC BLOCK ---
        const raycaster = new THREE.Raycaster();
        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return; 
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0 && intersects[0].distance < 5) {
                const hit = intersects[0]; const p = hit.object.position;
                if (e.button === 0) { 
                    scene.remove(hit.object); removeBlockData(p.x, p.y, p.z);
                    blocks.splice(blocks.indexOf(hit.object), 1); updateBlocksVisibility();
                } else if (e.button === 2) { 
                    const blockToPlace = hotbarData[inventorySelectedSlot];
                    if (!blockToPlace) return; 

                    const n = hit.face.normal; 
                    const newX = Math.round(p.x + n.x), newY = Math.round(p.y + n.y), newZ = Math.round(p.z + n.z);
                    
                    const r = 0.3;
                    const pMinX = camera.position.x - r, pMaxX = camera.position.x + r;
                    const pMinY = camera.position.y - player.height, pMaxY = camera.position.y;
                    const pMinZ = camera.position.z - r, pMaxZ = camera.position.z + r;
                    const bMinX = newX - 0.5, bMaxX = newX + 0.5, bMinY = newY - 0.5, bMaxY = newY + 0.5, bMinZ = newZ - 0.5, bMaxZ = newZ + 0.5;

                    if (!(pMaxX > bMinX && pMinX < bMaxX && pMaxY > bMinY && pMinY < bMaxY && pMaxZ > bMinZ && pMinZ < bMaxZ)) {
                        createBlock(newX, newY, newZ, blockToPlace); updateBlocksVisibility(); 
                    }
                }
            }
        });
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- VẬT LÝ ---
        function isColliding(px, py, pz, height) {
            const r = 0.3; const minX = Math.round(px - r), maxX = Math.round(px + r);
            const minY = Math.round(py - height + 0.05), maxY = Math.round(py + 0.1); 
            const minZ = Math.round(pz - r), maxZ = Math.round(pz + r);
            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) { if (getBlockData(x, y, z)) return true; }
                }
            }
            return false;
        }

        function getGroundY(x, z, maxFootY) {
            const pSize = 0.3; const minX = Math.round(x - pSize), maxX = Math.round(x + pSize);
            const minZ = Math.round(z - pSize), maxZ = Math.round(z + pSize);
            const startY = Math.round(maxFootY + 0.1);
            let highestY = -Infinity;
            for (let bx = minX; bx <= maxX; bx++) {
                for (let bz = minZ; bz <= maxZ; bz++) {
                    for (let by = startY; by >= -10; by--) { 
                        if (getBlockData(bx, by, bz)) { if (by > highestY) highestY = by; break; }
                    }
                }
            }
            return highestY !== -Infinity ? highestY + 0.5 : -Infinity;
        }

        // --- VÒNG LẶP CHÍNH ---
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now(); const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (controls.isLocked && hasGeneratedWorld) {
                let targetHeight = (shiftPressed && !isFlying && player.canJump) ? 1.3 : 1.6;
                if (player.height === 1.3 && targetHeight === 1.6 && isColliding(camera.position.x, camera.position.y + 0.3, camera.position.z, 1.6)) targetHeight = 1.3;
                if (player.height !== targetHeight) { camera.position.y += (targetHeight - player.height); player.height = targetHeight; }
                isCrouching = (player.height === 1.3);
                const currentSpeed = isCrouching ? player.speed * 0.5 : (isFlying ? player.speed * 2 : player.speed);

                const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
                const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();

                let moveVector = new THREE.Vector3(0, 0, 0);
                if (move.forward) moveVector.add(dir); if (move.backward) moveVector.sub(dir);
                if (move.right) moveVector.add(right); if (move.left) moveVector.sub(right);
                if (moveVector.lengthSq() > 0) moveVector.normalize();

                let dx = moveVector.x * currentSpeed * delta, dz = moveVector.z * currentSpeed * delta;
                if (isColliding(camera.position.x + dx, camera.position.y, camera.position.z, player.height)) dx = 0;
                if (isColliding(camera.position.x, camera.position.y, camera.position.z + dz, player.height)) dz = 0;

                if (isFlying) {
                    player.velocity.y = 0; let dy = 0;
                    if (spacePressed) dy += 6.0 * delta; if (shiftPressed) dy -= 6.0 * delta; 
                    if (dy !== 0) {
                        if (!isColliding(camera.position.x, camera.position.y + dy, camera.position.z, player.height)) camera.position.y += dy;
                        else if (dy < 0) isFlying = false; 
                    }
                    camera.position.x += dx; camera.position.z += dz;
                } else {
                    player.velocity.x -= player.velocity.x * 10.0 * delta; player.velocity.z -= player.velocity.z * 10.0 * delta;
                    player.velocity.y -= gravity * delta;
                    const oldFootY = camera.position.y - player.height;
                    if (isCrouching) {
                        if (getGroundY(camera.position.x + dx, camera.position.z, oldFootY) < oldFootY - 0.1) dx = 0;
                        if (getGroundY(camera.position.x, camera.position.z + dz, oldFootY) < oldFootY - 0.1) dz = 0;
                        if (getGroundY(camera.position.x + dx, camera.position.z + dz, oldFootY) < oldFootY - 0.1) { dx = 0; dz = 0; }
                    }
                    camera.position.x += dx; camera.position.z += dz;
                    if (player.velocity.y > 0 && isColliding(camera.position.x, camera.position.y + player.velocity.y * delta, camera.position.z, player.height)) player.velocity.y = 0; 
                    camera.position.y += player.velocity.y * delta;

                    const groundY = getGroundY(camera.position.x, camera.position.z, oldFootY);
                    const currentFootY = camera.position.y - player.height;
                    if (currentFootY <= groundY && player.velocity.y <= 0) {
                        player.velocity.y = 0; player.canJump = true; camera.position.y = groundY + player.height;
                    } else player.canJump = false; 
                }
                if (camera.position.y <= -10) spawnPlayer(); // Rớt khỏi map
            }
            prevTime = time; renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
