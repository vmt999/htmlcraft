<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Clone V5 - Sky Text</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        
        #ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: white; font-family: 'Courier New', monospace; cursor: pointer;
            background: rgba(0,0,0,0.8); padding: 30px; border-radius: 10px; border: 2px solid white; z-index: 100;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 28px; pointer-events: none; display: none; z-index: 50;
        }

        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; flex-direction: row; gap: 5px; z-index: 60;
        }

        .slot {
            width: 60px; height: 60px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 4px solid #555;
            display: flex; align-items: center; justify-content: center;
        }
        .slot.selected {
            border-color: #fff;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .icon {
            width: 36px; height: 36px;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.4), inset 4px 4px 0px rgba(255,255,255,0.4);
        }
        .icon-stone { background: #7d7d7d; }
        .icon-grass { background: linear-gradient(to bottom, #55aa55 30%, #8b4513 30%); }
        .icon-dirt { background: #8b4513; }
    </style>
</head>
<body>
    <div id="ui">
        <h1 style="color: #00ffff;">HTMLCRAFT</h1>
        <p>Click vào đây để chơi</p>
    </div>

    <div id="crosshair">+</div>

    <div id="hotbar">
        <div class="slot selected" id="slot-0" data-block-type="stone">
            <div class="icon icon-stone"></div>
        </div>
        <div class="slot" id="slot-1" data-block-type="grass">
            <div class="icon icon-grass"></div>
        </div>
        <div class="slot" id="slot-2" data-block-type="dirt">
            <div class="icon icon-dirt"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/PointerLockControls.js';

        let inventorySelectedSlot = 0;

        // --- 1. KHỞI TẠO THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 15, 40);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xcccccc));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // --- 2. HỆ THỐNG TẠO TEXTURE & CHỮ TRÊN BẦU TRỜI ---
        function generatePixelTexture(baseColor, noiseColor, type = 'normal') {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 16, 16);
            for (let i = 0; i < 16; i++) {
                for (let j = 0; j < 16; j++) {
                    if (Math.random() > 0.6) {
                        ctx.fillStyle = noiseColor;
                        ctx.fillRect(i, j, 1, 1);
                    }
                }
            }
            if (type === 'grass_side') {
                ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 16, 16); 
                ctx.fillStyle = '#55aa55'; ctx.fillRect(0, 0, 16, 4);  
                for (let i = 0; i < 16; i++) {
                    for (let j = 0; j < 5; j++) {
                        if (Math.random() > 0.5) {
                            ctx.fillStyle = '#448844'; ctx.fillRect(i, j, 1, 1);
                        }
                    }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        // Tạo chữ bầu trời bằng Canvas Texture
        function createSkyText(text, width = 40, height = 10) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.font = 'bold 120px "Courier New", sans-serif';
            ctx.fillStyle = '#FFFF00';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Viền chữ bóng đổ cho nổi bật
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 12;
            ctx.fillText(text, 512, 128);

            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false,
                fog: false // Tắt sương mù để chữ luôn sáng rõ
            });

            const geo = new THREE.PlaneGeometry(width, height);
            return new THREE.Mesh(geo, mat);
        }

        // Chữ Hướng Bắc (Z âm)
        const textNorth = createSkyText('VMT', 30, 8);
        textNorth.position.set(0, 18, -60);
        scene.add(textNorth);

        // Chữ Hướng Nam (Z dương)
        const textSouth = createSkyText('HTMLCRAFT', 50, 12);
        textSouth.position.set(0, 18, 60);
        textSouth.rotation.y = Math.PI; // Quay mặt về phía người chơi
        scene.add(textSouth);

        const texStone = generatePixelTexture('#7d7d7d', '#606060');
        const texDirt = generatePixelTexture('#8b4513', '#70350d');
        const texGrassTop = generatePixelTexture('#55aa55', '#448844');
        const texGrassSide = generatePixelTexture('#8b4513', '#70350d', 'grass_side');

        const matStone = new THREE.MeshStandardMaterial({ map: texStone });
        const matDirt = new THREE.MeshStandardMaterial({ map: texDirt });
        const matsGrass = [
            new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: texGrassSide }), 
            new THREE.MeshStandardMaterial({ map: texGrassTop }), new THREE.MeshStandardMaterial({ map: texDirt }),      
            new THREE.MeshStandardMaterial({ map: texGrassSide }), new THREE.MeshStandardMaterial({ map: texGrassSide }), 
        ];

        // --- 3. SINH ĐỊA HÌNH ---
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];

        function createBlock(x, y, z, type) {
            let mat = matStone;
            if (type === 'grass') mat = matsGrass;
            else if (type === 'dirt') mat = matDirt;

            const block = new THREE.Mesh(geometry, mat);
            block.position.set(x, y, z);
            block.name = type;
            scene.add(block);
            blocks.push(block);
        }

        for (let x = -10; x < 10; x++) {
            for (let z = -10; z < 10; z++) {
                createBlock(x, 6, z, 'grass');
                createBlock(x, 5, z, 'dirt');
                createBlock(x, 4, z, 'dirt');
                createBlock(x, 3, z, 'dirt');
                createBlock(x, 2, z, 'dirt');
                createBlock(x, 1, z, 'dirt');
                createBlock(x, 0, z, 'stone');
            }
        }

        createBlock(3, 7, 3, 'stone'); createBlock(3, 7, 5, 'stone');
        createBlock(3, 8, 4, 'stone'); createBlock(3, 9, 4, 'stone');
        createBlock(4, 9, 4, 'stone'); createBlock(5, 9, 4, 'stone');

        function spawnRandomStructures(count = 5) {
            for (let i = 0; i < count; i++) {
                const rx = Math.floor(Math.random() * 17) - 8;
                const rz = Math.floor(Math.random() * 17) - 8;
                if (rx >= 3 && rx <= 5 && rz >= 3 && rz <= 5) continue;
                createBlock(rx, 7, rz, 'stone'); createBlock(rx, 7, rz + 2, 'stone');
                createBlock(rx, 8, rz + 1, 'stone'); createBlock(rx, 9, rz + 1, 'stone');
            }
        }
        spawnRandomStructures(5);

        // --- 4. ĐIỀU KHIỂN & VẬT LÝ ---
        const controls = new PointerLockControls(camera, document.body);
        const player = { height: 1.6, speed: 4.0, jumpForce: 7.0, velocity: new THREE.Vector3(), canJump: false };
        const gravity = 20.0;
        camera.position.set(0, 15, 0); 

        let isFlying = false;
        let isCrouching = false;
        let shiftPressed = false;
        let spacePressed = false;
        let lastSpaceTime = 0;

        const ui = document.getElementById('ui');
        ui.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => {
            ui.style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hotbar').style.display = 'flex';
        });
        controls.addEventListener('unlock', () => {
            ui.style.display = 'block';
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('hotbar').style.display = 'none';
        });

        const move = { forward: false, backward: false, left: false, right: false };
        
        document.addEventListener('keydown', (e) => {
            if (!controls.isLocked) return;
            switch (e.code) {
                case 'KeyW': move.forward = true; break;
                case 'KeyA': move.left = true; break;
                case 'KeyS': move.backward = true; break;
                case 'KeyD': move.right = true; break;
                case 'ShiftLeft':
                case 'ShiftRight': shiftPressed = true; break;
                case 'Space':
                    spacePressed = true;
                    const now = performance.now();
                    if (now - lastSpaceTime < 300) {
                        isFlying = !isFlying;
                        player.velocity.y = 0;
                    } else if (!isFlying && player.canJump) {
                        player.velocity.y = player.jumpForce;
                        player.canJump = false;
                    }
                    lastSpaceTime = now;
                    break;
                case 'Digit1': updateSelectedSlot(0); break;
                case 'Digit2': updateSelectedSlot(1); break;
                case 'Digit3': updateSelectedSlot(2); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': move.forward = false; break;
                case 'KeyA': move.left = false; break;
                case 'KeyS': move.backward = false; break;
                case 'KeyD': move.right = false; break;
                case 'ShiftLeft':
                case 'ShiftRight': shiftPressed = false; break;
                case 'Space': spacePressed = false; break;
            }
        });

        document.addEventListener('wheel', (e) => {
            if (!controls.isLocked) return;
            let newSlot = inventorySelectedSlot + (e.deltaY > 0 ? 1 : -1);
            if(newSlot < 0) newSlot = 2;
            if(newSlot > 2) newSlot = 0;
            updateSelectedSlot(newSlot);
        });

        function updateSelectedSlot(index) {
            document.getElementById(`slot-${inventorySelectedSlot}`).classList.remove('selected');
            inventorySelectedSlot = index;
            document.getElementById(`slot-${inventorySelectedSlot}`).classList.add('selected');
        }

        // --- 5. ĐẬP / ĐẶT BLOCK ---
        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0);

        document.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            raycaster.setFromCamera(centerScreen, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0 && intersects[0].distance < 5) {
                const hit = intersects[0];
                if (e.button === 0) {
                    scene.remove(hit.object);
                    const index = blocks.indexOf(hit.object);
                    if (index > -1) blocks.splice(index, 1);
                }
                else if (e.button === 2) {
                    const p = hit.object.position;
                    const n = hit.face.normal; 
                    const blockType = document.getElementById(`slot-${inventorySelectedSlot}`).dataset.blockType;
                    
                    const newX = Math.round(p.x + n.x);
                    const newY = Math.round(p.y + n.y);
                    const newZ = Math.round(p.z + n.z);
                    
                    if (newY > 20) return; 
                    
                    const r = 0.3;
                    const pMinX = camera.position.x - r, pMaxX = camera.position.x + r;
                    const pMinY = camera.position.y - player.height, pMaxY = camera.position.y;
                    const pMinZ = camera.position.z - r, pMaxZ = camera.position.z + r;
                    
                    const bMinX = newX - 0.5, bMaxX = newX + 0.5;
                    const bMinY = newY - 0.5, bMaxY = newY + 0.5;
                    const bMinZ = newZ - 0.5, bMaxZ = newZ + 0.5;

                    if (!(pMaxX > bMinX && pMinX < bMaxX && pMaxY > bMinY && pMinY < bMaxY && pMaxZ > bMinZ && pMinZ < bMaxZ)) {
                        createBlock(newX, newY, newZ, blockType);
                    }
                }
            }
        });
        document.addEventListener('contextmenu', e => e.preventDefault());

        // --- 6. XỬ LÝ VA CHẠM ---
        function isColliding(px, py, pz, height) {
            const r = 0.3; 
            const pMinX = px - r, pMaxX = px + r;
            const pMinY = py - height + 0.05, pMaxY = py + 0.1; 
            const pMinZ = pz - r, pMaxZ = pz + r;

            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i].position;
                const bMinX = b.x - 0.5, bMaxX = b.x + 0.5;
                const bMinY = b.y - 0.5, bMaxY = b.y + 0.5;
                const bMinZ = b.z - 0.5, bMaxZ = b.z + 0.5;

                if (pMaxX > bMinX && pMinX < bMaxX && pMaxY > bMinY && pMinY < bMaxY && pMaxZ > bMinZ && pMinZ < bMaxZ) {
                    return true; 
                }
            }
            return false;
        }

        function getGroundY(x, z, maxFootY) {
            const pSize = 0.3;
            const pMinX = x - pSize, pMaxX = x + pSize;
            const pMinZ = z - pSize, pMaxZ = z + pSize;
            let highestY = -Infinity;

            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i].position;
                if (b.y + 0.5 <= maxFootY + 0.1) {
                    const bMinX = b.x - 0.5, bMaxX = b.x + 0.5;
                    const bMinZ = b.z - 0.5, bMaxZ = b.z + 0.5;

                    if (pMaxX > bMinX && pMinX < bMaxX && pMaxZ > bMinZ && pMinZ < bMaxZ) {
                        if (b.y > highestY) highestY = b.y;
                    }
                }
            }
            return highestY !== -Infinity ? highestY + 0.5 : -Infinity;
        }

        // --- 7. VÒNG LẶP CHÍNH ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (controls.isLocked) {
                let targetHeight = (shiftPressed && !isFlying && player.canJump) ? 1.3 : 1.6;

                if (player.height === 1.3 && targetHeight === 1.6) {
                    if (isColliding(camera.position.x, camera.position.y + 0.3, camera.position.z, 1.6)) {
                        targetHeight = 1.3;
                    }
                }

                if (player.height !== targetHeight) {
                    camera.position.y += (targetHeight - player.height);
                    player.height = targetHeight;
                }

                isCrouching = (player.height === 1.3);
                const currentSpeed = isCrouching ? player.speed * 0.5 : (isFlying ? player.speed * 2 : player.speed);

                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0; dir.normalize();
                
                const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();

                let moveVector = new THREE.Vector3(0, 0, 0);
                if (move.forward) moveVector.add(dir);
                if (move.backward) moveVector.sub(dir);
                if (move.right) moveVector.add(right);
                if (move.left) moveVector.sub(right);
                if (moveVector.lengthSq() > 0) moveVector.normalize();

                let dx = moveVector.x * currentSpeed * delta;
                let dz = moveVector.z * currentSpeed * delta;

                if (isColliding(camera.position.x + dx, camera.position.y, camera.position.z, player.height)) dx = 0;
                if (isColliding(camera.position.x, camera.position.y, camera.position.z + dz, player.height)) dz = 0;

                if (isFlying) {
                    player.velocity.y = 0;
                    const flySpeed = 6.0;
                    let dy = 0;
                    
                    if (spacePressed) dy += flySpeed * delta; 
                    if (shiftPressed) dy -= flySpeed * delta; 
                    
                    if (dy !== 0) {
                        if (!isColliding(camera.position.x, camera.position.y + dy, camera.position.z, player.height)) {
                            camera.position.y += dy;
                        } else {
                            if (dy < 0) isFlying = false; 
                        }
                    }

                    camera.position.x += dx;
                    camera.position.z += dz;
                } 
                else {
                    player.velocity.x -= player.velocity.x * 10.0 * delta;
                    player.velocity.z -= player.velocity.z * 10.0 * delta;
                    player.velocity.y -= gravity * delta;

                    const oldFootY = camera.position.y - player.height;

                    if (isCrouching) {
                        if (getGroundY(camera.position.x + dx, camera.position.z, oldFootY) < oldFootY - 0.1) dx = 0;
                        if (getGroundY(camera.position.x, camera.position.z + dz, oldFootY) < oldFootY - 0.1) dz = 0;
                        if (getGroundY(camera.position.x + dx, camera.position.z + dz, oldFootY) < oldFootY - 0.1) { dx = 0; dz = 0; }
                    }

                    camera.position.x += dx;
                    camera.position.z += dz;

                    if (player.velocity.y > 0) {
                        if (isColliding(camera.position.x, camera.position.y + player.velocity.y * delta, camera.position.z, player.height)) {
                            player.velocity.y = 0; 
                        }
                    }
                    camera.position.y += player.velocity.y * delta;

                    const groundY = getGroundY(camera.position.x, camera.position.z, oldFootY);
                    const currentFootY = camera.position.y - player.height;

                    if (currentFootY <= groundY && player.velocity.y <= 0) {
                        player.velocity.y = 0;
                        player.canJump = true;
                        camera.position.y = groundY + player.height;
                    } else {
                        player.canJump = false; 
                    }
                }

                if (camera.position.y <= -5) {
                    camera.position.set(0, 15, 0);
                    player.velocity.y = 0;
                    isFlying = false;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
